# Weekly pull requests for outdated dependencies and GitHub Actions (ADR 0014). Each one runs
# through CI like any other pull request. next-auth is pinned to an exact beta (ADR 0007), so it's
# upgraded by hand after reading the changelog.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: next-auth
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
